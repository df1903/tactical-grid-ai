[project]
name = "tactical-grid"
version = "0.1.0"
description = "Tactical grid game as environment for BFS, DFS, UCS, A*, Beam, Minimax and alpha-beta"
authors = [
    { name = "Daniel Felipe Franco Rincón", email = "daniel.franco.rincon@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"
